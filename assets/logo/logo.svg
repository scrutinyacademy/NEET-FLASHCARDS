<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="circleGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#CBEAFF" />
      <stop offset="70%" stop-color="#A8DAFF" />
      <stop offset="100%" stop-color="#93CCFB" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="250" cy="250" r="230" fill="url(#circleGrad)" filter="url(#subtleShadow)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Monogram SA -->
  <g font-family="'Times New Roman', Times, 'Playfair Display', serif" font-weight="400" fill="#0A0E1A" text-anchor="middle">
    <!-- Letter S positioned slightly higher left -->
    <text x="210" y="235" font-size="160" letter-spacing="-2">S</text>
    <!-- Letter A positioned slightly lower right with graceful overlap -->
    <text x="285" y="285" font-size="175" letter-spacing="-2">A</text>
  </g>

  <!-- Script text: Scrutiny academy -->
  <g font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Great Vibes', cursive" font-size="44" fill="#0A0E1A" text-anchor="middle">
    <text x="250" y="325" letter-spacing="1">Scrutiny academy</text>
  </g>
</svg>
